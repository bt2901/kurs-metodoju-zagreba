# Lesson 2: what the lesson consists of (see lesson01_structure.yml for the
# format and the options).
#
# Draft: just the text and its vocabulary. Add `- grammar` once
# tradukenda/<lang>/gramatiko/02.md holds ISV grammar notes for it, and
# exercise units (`- id: ...` / `type: ...`) when there is something to
# practise; add word overrides under `glosses:`.
glosses:
  ziťju:                     # is it in slovnik? it's complicated
    lemma: žiti
  slab:                     # is it in slovnik? it's complicated
    lemma: slaby
  imamo:                  # dirty spot-fix
    lemma: "iměti, imati"
  imal:                  # dirty spot-fix
    lemma: "iměti, imati"
  oddyha:
    lemma: oddyh
  pardon:                    # not in slovnik
    gloss:
      en: [excuse me, sorry]
      ru: [пардон, извините]
      hr: [oprosti, izvini, ispričavam se, pardon, oprostite]
  vladimir:
    lemma: vladimir
    gloss: male name
    scope: local
  borodin:
    lemma: borodin
    gloss: male name
    scope: local

units:

- grammar
- text
- vocab

- id: cloze
  type: cloze                # [brackets] mark what the learner types
  items:
    ru:
      - "Nam [sųt] potrěbn[i] programist[i]"
      - "Sponsor našego projekta [jest] Nikola"
      - "Sponsorom Nikoly Tesly [byl] Robert Džonson"
    hr:
      - "Nikola Tesla imal kontakt[y] sȯ něktor[ymi] sponsor[ami]."
